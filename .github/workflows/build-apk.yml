name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuraniQate-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Quran-Asaan.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Quran-Asaan.apk --title "Quran Asaan app (latest)" --notes "Download Quran-Asaan.apk on your Android phone and install it."
