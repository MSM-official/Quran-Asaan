name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Download Urdu Nastaliq font (Noto, open license)
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fsSL -o app/src/main/assets/fonts/nastaliq.ttf \
            "https://github.com/google/fonts/raw/main/ofl/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf" \
            && ls -la app/src/main/assets/fonts \
            || echo "::warning::Font download failed, app will use the phone's Urdu font"

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build signed Play Store bundle (.aab)
        id: aab
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets not set, skipping Play Store bundle"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/upload-key.p12"
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload-key.p12"
          ./gradlew bundleRelease --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab Quran-Asaan-playstore.aab
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuraniQate-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Quran-Asaan.apk
          FILES="Quran-Asaan.apk"
          if [ -f Quran-Asaan-playstore.aab ]; then FILES="$FILES Quran-Asaan-playstore.aab"; fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest $FILES --title "Quran Asaan app (build ${{ github.run_number }})" \
            --notes "Quran-Asaan.apk: install on your phone. Quran-Asaan-playstore.aab: upload to Google Play Console."
