name: Deploy web app (iPhone + all phones)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (web files + the same page images as the Android app)
        run: |
          mkdir -p site
          cp -r web/. site/
          cp -r app/src/main/assets/cards site/cards
          cp -r app/src/main/assets/pages site/pages
          sed -i "s/__BUILD__/${{ github.run_number }}/g" site/sw.js
          touch site/.nojekyll
          du -sh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
